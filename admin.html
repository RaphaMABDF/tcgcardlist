<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Validador de Imagens Pokémon TCG</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="hero"><div class="hero__content"><span class="badge">Administração</span><h1>Validador de imagens</h1><p>Informe nome e número, escolha a imagem correta e copie a URL para a coluna URL_Imagem da planilha.</p></div></header><main><section class="controls"><input id="name" placeholder="Nome, ex.: Charizard ex"><input id="number" placeholder="Número, ex.: 199"><button onclick="searchCards()">Buscar cartas</button></section><section id="results" class="catalog"></section></main><script>
const $=id=>document.getElementById(id); async function searchCards(){const name=$('name').value.trim(); const number=$('number').value.trim(); const q=[]; if(name) q.push(`name:${name.replace(/\s+/g,'* ')}*`); if(number) q.push(`number:${number}`); const url=`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q.join(' '))}&select=id,name,number,set,rarity,images`; const j=await fetch(url).then(r=>r.json()); $('results').innerHTML=(j.data||[]).slice(0,24).map(c=>`<article class="card"><div class="imageWrap"><img src="${c.images?.large||c.images?.small}" alt="${c.name}"></div><div class="cardBody"><h2>${c.name}</h2><p class="meta">${c.set?.name||''} • Nº ${c.number||''} • ${c.rarity||''}</p><button onclick="navigator.clipboard.writeText('${c.images?.large||c.images?.small}'); this.textContent='URL copiada!'">Copiar URL da imagem</button></div></article>`).join('') || '<section class="empty"><h2>Nenhuma carta encontrada</h2></section>';}
</script></body></html>
